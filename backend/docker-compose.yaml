services:
  redis:
    image: "redis:alpine3.13"
    command: >
      --requirepass redis
    restart: always
    ports:
      - 6381:6379

  postgres:
    image: "postgres:16"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pokemon_helper
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  jaeger:
    image: "jaegertracing/all-in-one:1.53"
    restart: always
    ports:
      - 16686:16686
      - 14250:14250
      - 14268:14268
      - 6831:6831/udp
      - 6832:6832/udp
      - 4317:4317

volumes:
  postgres_data:
